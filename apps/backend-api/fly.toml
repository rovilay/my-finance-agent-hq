# Fly.io configuration for Finance Agent HQ Backend - PRODUCTION
# https://fly.io/docs/reference/configuration/

app = "finance-agent-backend"
primary_region = "yyz" # Toronto (closest to Ontario)

# Build configuration
[build]
  dockerfile = "Dockerfile"
  build_context = "../.."  # Build from monorepo root

# Environment variables (non-sensitive)
[env]
  NODE_ENV = "production"
  PORT = "3000"

# HTTP service
[[services]]
  internal_port = 3000
  protocol = "tcp"

  # Keep at least 1 instance running in production
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  # Health check
  [[services.http_checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/health"
    protocol = "http"

# Resource allocation (production: more resources)
[vm]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512

# Metrics
[metrics]
  port = 9091
  path = "/metrics"
