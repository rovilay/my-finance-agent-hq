# Use existing ledger query (no pagination support yet in backend)
query GetFinancialEntries($entityId: String!, $taxYear: String) {
  ledger(entityId: $entityId, taxYear: $taxYear) {
    id
    amount
    category
    currency
    date
    entityId
    taxYear
    type
    createdAt
    updatedAt
  }
}
