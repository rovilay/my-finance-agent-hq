mutation VerifyAndFinalizeDocument(
  $documentId: ID!
  $approved: Boolean!
  $shouldKeepFile: Boolean
) {
  verifyAndFinalize(documentId: $documentId, approved: $approved, shouldKeep: $shouldKeepFile) {
    id
    status
  }
}

query GetDocumentsByEntity($entityId: ID!, $pagination: PaginationInput, $status: String) {
  documentsByEntity(entityId: $entityId, pagination: $pagination, status: $status) {
    items {
      id
      entityId
      fileName
      status
      retentionPolicy
      storagePath
      purgedAt
      failureReason
      decryptedData
      createdAt
      updatedAt
      fileMetadata {
        mimeType
        sizeInKb
      }
    }
    total
    skip
    take
    hasMore
  }
}

query GetDocument($id: ID!) {
  document(id: $id) {
    id
    entityId
    fileName
    status
    retentionPolicy
    storagePath
    purgedAt
    createdAt
    updatedAt
    decryptedData
    fileMetadata {
      mimeType
      sizeInKb
    }
  }
}
