name: Deploy Frontend to Staging

on:
  push:
    branches: [develop]
    paths:
      - 'apps/web-app/**'
      - 'packages/**'
      - '.github/workflows/deploy-frontend-staging.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Frontend to Fly.io
    runs-on: ubuntu-latest
    concurrency: deploy-frontend-staging

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Fly.io CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Validate Fly.io token configuration
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_FRONTEND_STAGING }}
        run: |
          if [[ -z "${FLY_API_TOKEN}" ]]; then
            echo "::error::Missing GitHub Actions secret FLY_API_TOKEN_FRONTEND_STAGING."
            echo "::error::Create an app-scoped deploy token with: fly tokens create deploy -a finance-agent-frontend-stg --name 'github-actions frontend staging'"
            exit 1
          fi

          if [[ "${FLY_API_TOKEN}" != FlyV1* ]]; then
            echo "::error::Fly token must be the full value returned by Fly, including the 'FlyV1' prefix."
            echo "::error::Do not use the output of 'flyctl auth token' for GitHub Actions; use 'fly tokens create deploy' instead."
            exit 1
          fi

      - name: Deploy Frontend to Fly.io
        run: |
          flyctl deploy -a finance-agent-frontend-stg \
            --config apps/web-app/fly.staging.toml \
            --remote-only \
            --build-arg NEXT_PUBLIC_API_BASE_URL="${{ secrets.NEXT_PUBLIC_API_BASE_URL }}" \
            --build-arg NEXT_PUBLIC_FIREBASE_API_KEY="${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}" \
            --build-arg NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN="${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}" \
            --build-arg NEXT_PUBLIC_FIREBASE_PROJECT_ID="${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}" \
            --build-arg NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET="${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}" \
            --build-arg NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID="${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}" \
            --build-arg NEXT_PUBLIC_FIREBASE_APP_ID="${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_FRONTEND_STAGING }}
